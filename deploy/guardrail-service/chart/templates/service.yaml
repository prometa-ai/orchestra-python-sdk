{{- include "prometa-guardrail.validateValues" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometa-guardrail.fullname" . }}
  labels:
    {{- include "prometa-guardrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrail
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "prometa-guardrail.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: guardrail
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
