{{- include "prometa-guardrail.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometa-guardrail.fullname" . }}
  labels:
    {{- include "prometa-guardrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrail
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "prometa-guardrail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: guardrail
  template:
    metadata:
      {{- if or .Values.guardrailConfig.rolloutId .Values.podAnnotations }}
      annotations:
        {{- with .Values.guardrailConfig.rolloutId }}
        prometa.io/guardrail-config-rollout-id: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "prometa-guardrail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: guardrail
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "prometa-guardrail.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.gracefulShutdown.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: guardrail
          image: {{ include "prometa-guardrail.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: PROMETA_GUARDRAIL_HOST
              value: "0.0.0.0"
            - name: PROMETA_GUARDRAIL_CONFIG
              value: {{ printf "/etc/prometa-guardrail/%s" .Values.guardrailConfig.targetFile | quote }}
          volumeMounts:
            - name: guardrail-config
              mountPath: /etc/prometa-guardrail/{{ .Values.guardrailConfig.targetFile }}
              subPath: {{ .Values.guardrailConfig.key }}
              readOnly: true
            - name: guardrail-api-keys
              mountPath: /etc/prometa-guardrail/api-keys.json
              subPath: {{ .Values.credentials.apiKeysKey }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: guardrail-config
          {{- if .Values.guardrailConfig.existingSecret }}
          secret:
            secretName: {{ .Values.guardrailConfig.existingSecret | quote }}
          {{- else }}
          configMap:
            name: {{ .Values.guardrailConfig.existingConfigMap | quote }}
          {{- end }}
        - name: guardrail-api-keys
          secret:
            secretName: {{ .Values.credentials.existingSecret | quote }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
